name: Daily Quiz Reel Generator

on:
  schedule:
    - cron: "30 15 * * *"  # 9:00 PM IST
  workflow_dispatch:

jobs:
  run-quiz-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: Set up virtual environment & install requirements
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install --no-cache-dir -r requirements.txt

          mkdir -p output fonts

          if [ ! -f fonts/Montserrat-Bold.ttf ]; then
            wget -O fonts/Montserrat-Bold.ttf https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Bold.ttf
          fi

          if [ ! -f quiz_tracker.json ]; then
            echo '{"last_used_question": 0, "last_used_text": ""}' > quiz_tracker.json
          fi

      - name: Run script to generate quiz reel (uses venv Python!)
        run: |
          ./venv/bin/python generate_quiz_reel.py

          if ! ls output/quiz_reel_*.mp4 1> /dev/null 2>&1; then
            echo "❌ No quiz reel was generated!"
            exit 1
          fi

      - name: Move quiz reel to GitHub Pages folder
        run: |
          mkdir -p docs/output
          cp output/quiz_reel_*.mp4 docs/output/

      - name: Commit and push quiz reel to GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stash any existing changes
          git stash
          
          # Pull latest changes
          git pull origin main
          
          # Pop stashed changes if any
          git stash pop || true
          
          if ! git diff-index --quiet HEAD; then
              echo "Changes detected, committing and pushing to GitHub Pages..."
              git add quiz_tracker.json docs/output/quiz_reel_*.mp4 # Be explicit about files
              git commit -m "Automated: Update quiz tracker and new quiz reel [skip ci]"
              git push
              echo "pushed_to_gh_pages=true" >> $GITHUB_OUTPUT
          else
              echo "No changes to commit or push for GitHub Pages."
              echo "pushed_to_gh_pages=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload quiz reel to Instagram via Graph API
        run: |
          ./venv/bin/python upload_quiz_to_instagram.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }} 